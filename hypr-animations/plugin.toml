id = "mindset/hypr-animations"
name = "Hypr Animations"
version = "1.0.0"
plugin_api = 13
author = "mindset"
license = "MIT"
icon = "palette"
description = "Pick an animation preset from ~/.config/hypr/animations. Replaces the rofi animation picker."
tags = ["hyprland", "bar", "panel", "utility"]
dependencies = ["hyprland"]

[[setting]]
key = "presets_dir"
type = "string"
label_key = "settings.presets_dir.label"
description_key = "settings.presets_dir.description"
default = "~/.config/hypr/animations"

[[widget]]
id = "toggle"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 380
height = 410
placement = "floating"
position = "center"
capture_keys = ["Up", "Down", "Return"]
keyboard_focus = "exclusive"
