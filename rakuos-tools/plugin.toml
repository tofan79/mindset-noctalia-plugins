id = "mindset/rakuos-tools"
name = "RakuOS Tools"
version = "0.1.0"
plugin_api = 19
author = "mindset"
license = "MIT"
dependencies = ["rum", "bootc", "sudo-rs", "notify-send"]
tags = ["system", "updates", "rakuos", "maintenance"]
icon = "package"
description = "Check/update image and overlay packages, rollback, reset overlay, manage zram/kernel-args/repos — the RakuOS update center without software center."

# ── Plugin-level settings (seeded to every entry) ─────────────────────────────

[[setting]]
key = "glyph"
type = "glyph"
label_key = "settings.glyph.label"
description_key = "settings.glyph.description"
default = "package"

[[setting]]
key = "show_badge"
type = "bool"
label_key = "settings.show_badge.label"
description_key = "settings.show_badge.description"
default = true

[[setting]]
key = "check_interval_min"
type = "int"
label_key = "settings.check_interval_min.label"
description_key = "settings.check_interval_min.description"
default = 30
min = 5
max = 1440

[[setting]]
key = "check_packages"
type = "bool"
label_key = "settings.check_packages.label"
description_key = "settings.check_packages.description"
default = true

[[setting]]
key = "notify_on_updates"
type = "bool"
label_key = "settings.notify_on_updates.label"
description_key = "settings.notify_on_updates.description"
default = true

# ── Service: periodic update checker in the background ────────────────────────

[[service]]
id = "checker"
entry = "service.luau"

# ── Bar widget: update badge; click opens the panel ───────────────────────────

[[widget]]
id = "indicator"
entry = "widget.luau"
    [widget.actions]
    left = "none"
    right = "none"
    middle = "none"

# ── Control-center shortcut tile: one-click open panel ────────────────────────

[[shortcut]]
id = "update"
entry = "shortcut.luau"

# ── Panel: details + action buttons (the main UI) ─────────────────────────────

[[panel]]
id = "main"
entry = "panel.luau"
width = 520
height = 560
placement = "floating"
position = "center"
keyboard_focus = "on_demand"