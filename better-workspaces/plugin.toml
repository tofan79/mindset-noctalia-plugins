id           = "mindset/better-workspaces"
name         = "Better Workspaces"
version      = "1.1.0"
plugin_api   = 19
author       = "mindset"
license      = "MIT"
icon         = "layout-grid"
description  = "Workspace indicator with 12 display modes, special workspace support, and full customization — pill size, font weight/style, shape, gap. Right-click panel for all settings."
tags         = ["hyprland", "workspace", "indicator", "bar"]

dependencies = ["hyprctl"]

[[setting]]
key          = "workspaceConfigPath"
type         = "string"
label_key    = "settings.workspaceConfigPath.label"
description_key = "settings.workspaceConfigPath.description"
default      = ""

[[widget]]
id    = "widget"
entry = "widget.luau"

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 360
height          = 480
placement       = "floating"
position        = "center"
keyboard_focus  = "exclusive"
