id           = "mindset/better-workspaces"
name         = "Better Workspaces"
version      = "1.0.2"
plugin_api   = 19
author       = "mindset"
license      = "MIT"
icon         = "layout-grid"
description  = "Workspace indicator: click to switch, scroll to cycle, right-click for panel. Display mode and workspace count are controlled directly from the panel — no separate settings page."
tags         = ["hyprland", "workspace", "indicator", "bar"]

dependencies = ["hyprctl"]

[[widget]]
id    = "widget"
entry = "widget.luau"

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 360
height          = 480
placement       = "floating"
position        = "center"
keyboard_focus  = "exclusive"
