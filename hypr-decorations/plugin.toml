id = "mindset/hypr-decorations"
name = "Hypr Decorations"
version = "1.0.0"
plugin_api = 13
author = "mindset"
license = "MIT"
icon = "wand"
description = "Pick a decoration preset from ~/.config/hypr/decorations. Replaces the rofi decoration picker."
tags = ["hyprland", "bar", "panel", "utility"]
dependencies = ["hyprland"]

[[setting]]
key = "presets_dir"
type = "string"
label_key = "settings.presets_dir.label"
description_key = "settings.presets_dir.description"
default = "~/.config/hypr/decorations"

[[widget]]
id = "toggle"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 380
height = 400
placement = "floating"
position = "center"
capture_keys = ["Up", "Down", "Return"]
keyboard_focus = "exclusive"
