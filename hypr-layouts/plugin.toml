id = "mindset/hypr-layouts"
name = "Hypr Layouts"
version = "1.0.0"
plugin_api = 13
author = "mindset"
license = "MIT"
icon = "layout-grid"
description = "Pick the tiling layout of the active workspace from a centered panel. Replaces the rofi layout picker."
tags = ["hyprland", "bar", "panel", "service", "indicator"]
dependencies = ["hyprland"]

[[setting]]
key = "layouts_dir"
type = "string"
label_key = "settings.layouts_dir.label"
description_key = "settings.layouts_dir.description"
default = "~/.config/hypr/layouts"

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "toggle"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 360
height = 420
placement = "floating"
position = "center"
capture_keys = ["Up", "Down", "Return"]
keyboard_focus = "exclusive"
