id           = "mindset/better-displays"
name         = "Better Displays"
version      = "1.0.1"
plugin_api   = 13
author       = "mindset"
license      = "MIT"
icon         = "device-desktop"
description  = "Per-monitor resolution, scale, position, transform and per-terminal font sizes from the bar"
tags         = ["hyprland", "display", "monitor", "resolution"]
dependencies = ["hyprctl", "jq"]

[[setting]]
key          = "monitorsLua"
type         = "string"
label_key    = "settings.monitorsLua.label"
description_key = "settings.monitorsLua.description"
default      = ""

[[widget]]
id    = "toggle"
entry = "widget.luau"

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 420
height          = 640
placement       = "floating"
position        = "center"
keyboard_focus  = "exclusive"
